# Builds the Android shell and attaches it to the release for a v* tag.
#
# Why this exists: the APK used to be built by hand on the maintainer's device,
# and that stopped working — its aapt2 is an Android (bionic) binary while the
# Termux/proot system libpng is glibc, so the two cannot be linked and
# `processReleaseResources` dies with "Daemon startup failed". A hosted runner
# has a working SDK, so the tag that names a version also produces its APK.
name: APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to attach the APK to (blank = build only)'
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # No setup-android action: it insists on the long-obsolete `tools` package
      # and dies ("Failed to find package 'tools'"). ubuntu-latest already ships
      # a complete SDK, so just point Gradle at it.
      - name: Point Gradle at the runner's SDK
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # An unsigned release APK cannot be installed at all, and build.gradle's
      # `-PfirmaLocal` points at signingConfigs.debug — which needs a debug
      # keystore that a fresh runner does not have (it is normally created by a
      # debug build on a developer machine). Without this the APK came out with
      # no META-INF signature and Android refused it.
      #
      # With an ANDROID_KEYSTORE_BASE64 secret the APK is signed with YOUR key,
      # so each build installs as an upgrade over the last. Without it, a
      # throwaway key is generated per run: the APK installs, but only as a
      # fresh install (Android rejects an upgrade signed by a different key).
      - name: Prepare the signing key
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p ~/.android
          if [ -n "${KEYSTORE_B64:-}" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks"
              echo "RELEASE_STORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "RELEASE_KEY_ALIAS=$KEY_ALIAS"
              echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "stable=true" >> "$GITHUB_OUTPUT"
            echo "Signing with the configured release key."
          else
            # The exact coordinates the Android debug keystore always uses.
            keytool -genkeypair -v -keystore ~/.android/debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" >/dev/null
            echo "stable=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: signing with a throwaway debug key. The APK installs, but not as an upgrade over an APK signed with a different key."
          fi

      # The shell is a WebView over the deployed site, so it needs no web build.
      - name: Build
        working-directory: android
        run: ./gradlew assembleRelease -PfirmaLocal --no-daemon --stacktrace

      # An unsigned APK is useless; catch it here rather than at install time.
      # NOT by looking for META-INF/*.RSA: with minSdk 24 AGP skips the old v1
      # jar signing entirely and signs with APK Signature Scheme v2, whose
      # signature lives in the APK Signing Block, not in META-INF. Checking
      # META-INF failed a perfectly valid APK. apksigner is the real authority.
      - name: Check it is signed
        run: |
          set -euo pipefail
          apk=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          apksigner=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner | sort -V | tail -1)
          if [ -n "$apksigner" ]; then
            "$apksigner" verify --verbose --print-certs "$apk"
          else
            grep -qa 'APK Sig Block 42' "$apk" \
              || { echo "The APK carries no signing block, so Android would refuse it." >&2; exit 1; }
            echo "Signing block present (apksigner not on this runner)."
          fi

      - name: Name the artifact after the version
        id: apk
        run: |
          set -euo pipefail
          src=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          test -n "$src" || { echo "No APK produced"; exit 1; }
          cp "$src" gesto-studio.apk
          echo "path=gesto-studio.apk" >> "$GITHUB_OUTPUT"
          ls -l gesto-studio.apk

      - uses: actions/upload-artifact@v4
        with:
          name: gesto-studio-apk
          path: ${{ steps.apk.outputs.path }}

      # On a tag, attach it to that release so the "latest" download link works.
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "$TAG" --notes "Gesto Studio $TAG"
          gh release upload "$TAG" gesto-studio.apk --clobber
          if [ "${{ steps.signing.outputs.stable }}" != "true" ]; then
            echo "Note: signed with a throwaway key — uninstall any previous build before installing."
          fi
